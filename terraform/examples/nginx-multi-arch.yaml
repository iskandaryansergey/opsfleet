apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-multi-arch
  labels:
    app: nginx-multi-arch
spec:
  replicas: 4
  selector:
    matchLabels:
      app: nginx-multi-arch
  template:
    metadata:
      labels:
        app: nginx-multi-arch
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/arch
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: nginx-multi-arch
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: nginx-multi-arch
      containers:
        - name: nginx
          image: nginx:latest
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: nginx-multi-arch
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: nginx-multi-arch
